# Push to main -> image ghcr.io/alexagelos/personal-crm:<commit SHA> -> deploy to the staging
# on the server. The prod is NOT deployed here: the owner starts the workflow "Deploy prod"
# (deploy-prod.yml) by hand, and it takes a version that went green on the staging.
# Everything that happens on the server is in deploy/deploy.sh
name: Deploy staging

on:
  push:
    branches: [main]

permissions: {}

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=long,prefix=

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to staging
    needs: build
    # GitHub keeps the history of the deploys to this environment (Deployments). "Deploy prod"
    # reads it: only a version with a successful deploy here can go to the prod
    environment:
      name: staging
      url: https://test-app.crmgelos.ru
    # Deploys go one after another: a new push never interrupts a running deploy
    # (deploy.sh also holds a lock)
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The server pulls the image with this job's short-lived token
      packages: read
    env:
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
      DEPLOY_DIR: /srv/personal-crm
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # rsync writes every file under a temporary name and renames it: a deploy of the prod
      # that is running right now keeps reading the old deploy.sh, not a half-written one
      - name: Copy deploy scripts to the server
        run: rsync -rt deploy/ "$TARGET:$DEPLOY_DIR/"

      - name: Run deploy/deploy.sh on the server
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_ACTOR $REGISTRY_TOKEN" | ssh "$TARGET" bash "$DEPLOY_DIR/deploy.sh" staging "$GITHUB_SHA"
