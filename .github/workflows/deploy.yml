# Push to main -> image ghcr.io/alexagelos/personal-crm:<commit SHA> -> deploy to the staging
# and to the prod on the server. The two deploys start together and do not depend on each other:
# a broken staging does not stop the prod.
# Everything that happens on the server is in deploy/deploy.sh
name: Deploy

on:
  push:
    branches: [main]

permissions: {}

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=long,prefix=

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ matrix.environment }}
    needs: build
    strategy:
      # One environment failing does not cancel the other one
      fail-fast: false
      matrix:
        environment: [staging, prod]
    # Deploys to one environment go one after another: a new push never interrupts a running
    # deploy. Different environments run in parallel (deploy.sh also holds a lock per environment)
    concurrency:
      group: deploy-${{ matrix.environment }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The server pulls the image with this job's short-lived token
      packages: read
    env:
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
      DEPLOY_DIR: /srv/personal-crm
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # rsync writes every file under a temporary name and renames it: a deploy of the other
      # environment that is running right now keeps reading the old deploy.sh, not a half-written one
      - name: Copy deploy scripts to the server
        run: rsync -rt deploy/ "$TARGET:$DEPLOY_DIR/"

      - name: Run deploy/deploy.sh on the server
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: echo "$GITHUB_ACTOR $REGISTRY_TOKEN" | ssh "$TARGET" bash "$DEPLOY_DIR/deploy.sh" "$ENVIRONMENT" "$GITHUB_SHA"
