# Local PostgreSQL for development. Connection settings come from .env
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Bound to localhost only: the database is not reachable from the network
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Since postgres 18 the volume is mounted at /var/lib/postgresql, not .../data
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  # Stand-in for the mail service: catches every login email, nothing leaves the computer.
  # SMTP on 1025, web page with the caught emails on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    environment:
      # Without this Mailpit looks up the name of every client before it greets it, and the
      # lookup of the Docker gateway address hangs: the app waits for the greeting in vain
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      # Bound to localhost only, like the database
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
