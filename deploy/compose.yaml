# Production on the server: docker compose project "prod", run by deploy.sh.
# Secrets come from .env next to this file (mode 600); the app version comes from
# APP_IMAGE, which deploy.sh sets for every run.
name: prod

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# TZ: pages show dates and times in this zone, the same as on the owner's computer.
# Login and email: what is not a secret is written here in the file, as TZ is; the secrets come
# from .env. The same image runs everywhere, only these settings tell it where to send emails:
# Resend over SMTP here, the Mailpit stand-in on the owner's computer.
# A missing line in .env stops docker compose with the message below, before anything changes
x-app-environment: &app-environment
  TZ: Europe/Moscow
  POSTGRES_HOST: db
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
  # The address the app is opened on: links in the emails lead there
  BETTER_AUTH_URL: https://app.crmgelos.ru
  # Signs the login cookie. Generated once on the server: openssl rand -base64 32
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (openssl rand -base64 32)}
  # Resend: the login is always "resend", the password is the API key. If the server does not let
  # port 465 out, 2465 works too: change SMTP_PORT here, nothing else
  SMTP_HOST: smtp.resend.com
  SMTP_PORT: "465"
  SMTP_SECURE: "true"
  SMTP_USER: resend
  SMTP_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD in .env (the Resend API key)}
  EMAIL_FROM: noreply@mail.crm.crmgelos.ru

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # No published port: only the containers of this project reach the database
    volumes:
      # Since postgres 18 the volume is mounted at /var/lib/postgresql, not .../data
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  # One-off container from the app image: applies migrations and exits.
  # Not started by "up"; deploy.sh runs it with "run --rm migrate"
  migrate:
    image: ${APP_IMAGE:?run deploy.sh, it sets APP_IMAGE}
    command: ["node", "tools/db/migrate.js"]
    environment:
      <<: *app-environment
      # Only here, only this container: migration 0003 gives the data that existed before login to
      # the user with this email (it is not written in the repository, which is public)
      OWNER_EMAIL: ${OWNER_EMAIL:?set OWNER_EMAIL in .env (the email of the owner of the existing data)}
    depends_on:
      db:
        condition: service_healthy
    profiles: [tools]
    logging: *logging

  app:
    image: ${APP_IMAGE:?run deploy.sh, it sets APP_IMAGE}
    restart: unless-stopped
    environment: *app-environment
    ports:
      # Localhost only: nginx proxies app.crmgelos.ru here
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
