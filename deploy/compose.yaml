# Production on the server: docker compose project "prod", run by deploy.sh.
# Secrets come from .env next to this file (mode 600); the app version comes from
# APP_IMAGE, which deploy.sh sets for every run.
name: prod

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# TZ: pages show dates and times in this zone, the same as on the owner's computer
x-app-environment: &app-environment
  TZ: Europe/Moscow
  POSTGRES_HOST: db
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # No published port: only the containers of this project reach the database
    volumes:
      # Since postgres 18 the volume is mounted at /var/lib/postgresql, not .../data
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  # One-off container from the app image: applies migrations and exits.
  # Not started by "up"; deploy.sh runs it with "run --rm migrate"
  migrate:
    image: ${APP_IMAGE:?run deploy.sh, it sets APP_IMAGE}
    command: ["node", "tools/db/migrate.js"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    profiles: [tools]
    logging: *logging

  app:
    image: ${APP_IMAGE:?run deploy.sh, it sets APP_IMAGE}
    restart: unless-stopped
    environment: *app-environment
    ports:
      # Localhost only: nginx proxies app.crmgelos.ru here
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
