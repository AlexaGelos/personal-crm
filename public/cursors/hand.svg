<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The gothic arrow over buttons and links: the same shape warmed by the candle, with a
       glowing ember rib and a soft halo. The tip is at 4,4, as in arrow.svg. -->
  <defs>
    <g id="arrow">
      <path d="M0 0C1.3 3.4 4.4 7.6 6.2 13.6C4.6 12.2 3 11.4 1.4 11.3V17H-1.4V11.3C-3 11.4 -4.6 12.2 -6.2 13.6C-4.4 7.6 -1.3 3.4 0 0Z" />
      <circle cy="18.3" r="1.5" />
      <circle cy="22.1" r="1.5" />
      <circle cx="1.9" cy="20.2" r="1.5" />
      <circle cx="-1.9" cy="20.2" r="1.5" />
    </g>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" />
    </filter>
  </defs>
  <g transform="translate(4 4) rotate(-27)">
    <use href="#arrow" fill="#ff9a4a" stroke="#ff9a4a" stroke-width="3" opacity="0.65" filter="url(#halo)" />
    <use href="#arrow" fill="none" stroke="#24160d" stroke-width="2" stroke-linejoin="round" />
    <use href="#arrow" fill="#f2dcc0" />
    <circle cy="20.2" r="0.7" fill="#24160d" />
    <path d="M0 3V11" stroke="#ff7a2a" stroke-width="1.1" stroke-linecap="round" />
  </g>
</svg>
